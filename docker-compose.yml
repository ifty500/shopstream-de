services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${EXTERNAL_POSTGRES_PORT:-5437}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  prefect:
    image: prefecthq/prefect:2.19.8-python3.11
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_UI_API_URL: http://localhost:4200/api
    ports:
      - "4200:4200"
    volumes:
      - prefectdata:/root/.prefect
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  metabase:
    image: metabase/metabase:v0.50.20
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabasedata:/metabase-data
    depends_on:
      - postgres

  app:
    build:
      context: .
      dockerfile: ./infra/app/Dockerfile
    env_file:
      - .env
    environment:
      PREFECT_API_URL: http://prefect:4200/api
    ports:
      - "${DBT_DOCS_PORT:-8081}:8080"   # dbt docs (make docs)
    depends_on:
      postgres:
        condition: service_healthy
      prefect:
        condition: service_healthy
    volumes:
      - ./:/workspace
    working_dir: /workspace

volumes:
  pgdata:
  prefectdata:
  metabasedata:
