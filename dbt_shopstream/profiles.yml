# Every DBT_* variable falls back to the matching POSTGRES_* one, so a single
# set of credentials in .env is enough.
shopstream:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', env_var('POSTGRES_HOST', 'postgres')) }}"
      user: "{{ env_var('DBT_USER', env_var('POSTGRES_USER')) }}"
      password: "{{ env_var('DBT_PASSWORD', env_var('POSTGRES_PASSWORD')) }}"
      port: "{{ env_var('DBT_PORT', env_var('POSTGRES_PORT', '5432')) | as_number }}"
      dbname: "{{ env_var('DBT_DBNAME', env_var('POSTGRES_DB')) }}"
      schema: public
      threads: 4
